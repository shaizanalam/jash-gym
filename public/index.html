<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NutriMentor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #06141B;
      color: #CCD0CF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(17, 33, 45, 0.85);
      border: 1px solid rgba(155, 167, 178, 0.2);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
    }
    .logo {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      object-fit: cover;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #9BA7B2;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .status {
      font-size: 13px;
      color: #34D399;
      margin-bottom: 16px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(155, 167, 178, 0.2);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .input-group {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }
    label {
      font-size: 12px;
      color: #9BA7B2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(155, 167, 178, 0.3);
      background: #0B1E28;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #10B981;
    }
    button {
      padding: 12px 16px;
      border-radius: 12px;
      background: #10B981;
      color: #06141B;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="NutriMentor" class="logo" onerror="this.style.display='none'" />
    <h1>NutriMentor</h1>
    <div id="loading-view">
      <div class="spinner"></div>
      <p id="status-text">Connecting to server...</p>
    </div>

    <div class="input-group">
      <label for="server-url">Server Address</label>
      <input type="text" id="server-url" value="http://192.168.29.53:3000" />
      <button onclick="connectToServer()">Connect</button>
    </div>
  </div>

  <script>
    const defaultUrl = 'http://192.168.29.53:3000';
    const savedUrl = localStorage.getItem('nutrimentor_server_url') || defaultUrl;
    const urlInput = document.getElementById('server-url');
    const statusText = document.getElementById('status-text');
    urlInput.value = savedUrl;

    function connectToServer() {
      const url = urlInput.value.trim().replace(/\/+$/, '');
      if (!url) return;
      localStorage.setItem('nutrimentor_server_url', url);
      statusText.textContent = 'Redirecting to ' + url + '...';
      window.location.href = url;
    }

    // Try auto-redirecting if page was loaded directly
    setTimeout(() => {
      connectToServer();
    }, 1500);
  </script>
</body>
</html>
